<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarQix - Mobile Auto Apps</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 50px 20px; background: #f8f9fa; color: #333; }
        h1 { font-size: 2.5rem; color: #1a202c; }
        p { font-size: 1.1rem; color: #4a5568; max-width: 600px; margin: 0 auto 30px; }
        .apps { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 40px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 250px; }
        .card h3 { margin-bottom: 8px; color: #2b6cb0; }
        footer { margin-top: 60px; font-size: 0.9rem; color: #a0aec0; }
    </style>
</head>
<body>
    <h1>CarQix</h1>
    <p>Connecting car buyers and sellers worldwide through intuitive, fast mobile applications.</p>
    
    <div class="apps">
        <div class="card">
            <h3>CarQix UK</h3>
            <p>Used Cars UK - Buy & Sell</p>
        </div>
        <div class="card">
            <h3>CarQix USA</h3>
            <p>Used Cars USA - Buy & Sell</p>
        </div>
        <div class="card">
            <h3>CarQix Canada</h3>
            <p>Used Cars Canada - Buy & Sell</p>
        </div>
    </div>

    <footer>
        &copy; CarQix. All rights reserved. | <a href="/app-ads.txt">app-ads.txt</a>
    </footer>
</body>
</html>
